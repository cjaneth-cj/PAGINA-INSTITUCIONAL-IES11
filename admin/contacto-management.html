<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buzón de Consultas - IES N° 11</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Enlace al archivo CSS unificado del panel -->
  <link rel="stylesheet" href="css/admin-styles.css">
</head>
<body class="contacto-page-body">

  <div class="contacto-container">
    <div class="back-nav">
      <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Volver al Panel Principal</a>
    </div>

    <div class="card">
      <div class="header-row">
        <h2><i class="fa-solid fa-inbox"></i> Consultas Recibidas</h2>
        <button id="btnActualizar" class="btn-action btn-view"><i class="fa-solid fa-rotate-right"></i> Actualizar</button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Estado</th>
              <th>Fecha</th>
              <th>Remitente</th>
              <th>Contacto</th>
              <th>Asunto</th>
              <th style="text-align: right;">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaMensajes">
            <tr><td colspan="6" style="text-align: center;">Cargando mensajes...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal para leer el mensaje completo -->
  <div id="modalLectura" class="modal">
    <div class="modal-content">
      <h3 id="modalAsunto"></h3>
      <p><strong>De:</strong> <span id="modalDe"></span></p>
      <p><strong>Email:</strong> <span id="modalEmail"></span></p>
      <p><strong>Teléfono:</strong> <span id="modalTel"></span></p>
      <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
      <p><strong>Mensaje:</strong></p>
      <p id="modalTexto" class="modal-text-box"></p>
      <button class="modal-close" id="btnCerrarModal">Cerrar</button>
    </div>
  </div>

  <!-- Librería CDN oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Cliente compartido de Supabase -->
  <script src="../assets/supabaseClient.js"></script>
  <!-- Control centralizado de autenticación -->
  <script src="js/admin-auth.js"></script>
  <!-- Lógica específica del módulo de contactos -->
  <script src="js/contacto-management.js"></script>
</body>
</html>
