<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buzón de Consultas - IES N° 11</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1e3a8a;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 30px; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    .back-nav { margin-bottom: 20px; }
    .back-nav a { text-decoration: none; color: var(--primary); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { font-size: 1.4rem; color: var(--primary); display: flex; align-items: center; gap: 10px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { background: #f1f5f9; color: var(--text-muted); font-weight: 600; }
    
    .badge-nuevo { background: #fee2e2; color: #dc2626; font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
    .badge-leido { background: #e2e8f0; color: #64748b; font-size: 0.75rem; font-weight: 600; padding: 3px 8px; border-radius: 4px; }
    
    .btn-action { border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .btn-view { background: #e0e7ff; color: #3730a3; margin-right: 5px; }
    .btn-del { background: #fee2e2; color: #b91c1c; }
    
    /* Modal de lectura */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: white; border-radius: 10px; padding: 25px; width: 100%; max-width: 550px; }
    .modal-content h3 { margin-bottom: 15px; color: var(--primary); }
    .modal-content p { margin-bottom: 10px; line-height: 1.5; font-size: 0.95rem; }
    .modal-close { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; float: right; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="back-nav">
      <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Volver al Panel Principal</a>
    </div>

    <div class="card">
      <div class="header-row">
        <h2><i class="fa-solid fa-inbox"></i> Consultas Recibidas</h2>
        <button onclick="cargarMensajes()" class="btn-action btn-view"><i class="fa-solid fa-rotate-right"></i> Actualizar</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Estado</th>
            <th>Fecha</th>
            <th>Remitente</th>
            <th>Contacto</th>
            <th>Asunto</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaMensajes">
          <tr><td colspan="6" style="text-align: center;">Cargando mensajes...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal para leer el mensaje completo -->
  <div id="modalLectura" class="modal">
    <div class="modal-content">
      <h3 id="modalAsunto"></h3>
      <p><strong>De:</strong> <span id="modalDe"></span></p>
      <p><strong>Email:</strong> <span id="modalEmail"></span></p>
      <p><strong>Teléfono:</strong> <span id="modalTel"></span></p>
      <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
      <p><strong>Mensaje:</strong></p>
      <p id="modalTexto" style="background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px solid var(--border); white-space: pre-wrap;"></p>
      <button class="modal-close" onclick="cerrarModal()">Cerrar</button>
    </div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/supabaseClient.js"></script>
  <script>
    // Validar sesión
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (!session) window.location.href = 'login.html';
    });

    const tabla = document.getElementById('tablaMensajes');
    let listaMensajes = [];

    async function cargarMensajes() {
      const { data, error } = await supabaseClient
        .from('mensajes_contacto')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        tabla.innerHTML = '<tr><td colspan="6" style="text-align:center;">Error al cargar consultas.</td></tr>';
        return;
      }

      if (!data || data.length === 0) {
        tabla.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted);">No hay consultas en el buzón actualmente.</td></tr>';
        return;
      }

      listaMensajes = data;
      tabla.innerHTML = '';

      data.forEach(m => {
        const fechaFormateada = new Date(m.created_at).toLocaleDateString('es-AR', {
          day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const fila = document.createElement('tr');
        fila.innerHTML = `
          <td>${m.leido ? '<span class="badge-leido">Leído</span>' : '<span class="badge-nuevo">Nuevo</span>'}</td>
          <td>${fechaFormateada}</td>
          <td><strong>${m.nombre}</strong></td>
          <td>${m.email}<br><small style="color:var(--text-muted)">${m.telefono || '-'}</small></td>
          <td>${m.asunto || 'Sin asunto'}</td>
          <td>
            <button class="btn-action btn-view" onclick="verMensaje(${m.id})"><i class="fa-solid fa-eye"></i> Leer</button>
            <button class="btn-action btn-del" onclick="eliminarMensaje(${m.id})"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tabla.appendChild(fila);
      });
    }

    async function verMensaje(id) {
      const msg = listaMensajes.find(m => m.id === id);
      if (!msg) return;

      document.getElementById('modalAsunto').innerText = msg.asunto || 'Consulta sin asunto';
      document.getElementById('modalDe').innerText = msg.nombre;
      document.getElementById('modalEmail').innerText = msg.email;
      document.getElementById('modalTel').innerText = msg.telefono || 'No especificado';
      document.getElementById('modalTexto').innerText = msg.mensaje;

      document.getElementById('modalLectura').style.display = 'flex';

      // Marcar como leído en Supabase si era nuevo
      if (!msg.leido) {
        await supabaseClient
          .from('mensajes_contacto')
          .update({ leido: true })
          .eq('id', id);
        msg.leido = true;
      }
    }

    function cerrarModal() {
      document.getElementById('modalLectura').style.display = 'none';
      cargarMensajes();
    }

    async function eliminarMensaje(id) {
      if (!confirm('¿Eliminar esta consulta?')) return;
      const { error } = await supabaseClient.from('mensajes_contacto').delete().eq('id', id);
      if (error) alert('Error: ' + error.message);
      else cargarMensajes();
    }

    cargarMensajes();
  </script>
</body>
</html>
