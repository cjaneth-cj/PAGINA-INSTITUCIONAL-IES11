<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Solicitudes Estudiantiles - IES N° 11</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Enlace al archivo CSS unificado del panel -->
  <link rel="stylesheet" href="css/admin-styles.css">
</head>
<body class="estudiantes-page-body">

  <div class="top-bar">
    <div class="page-title">
      <h1>Solicitudes Estudiantiles</h1>
      <p>Revisión, filtrado y gestión de trámites y certificados solicitados por alumnos.</p>
    </div>
    <div class="top-actions">
      <button id="btnImprimir" class="btn-action-top"><i class="fa-solid fa-print"></i> Imprimir Listado</button>
      <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Volver al Dashboard</a>
    </div>
  </div>

  <!-- Barra de Filtros -->
  <div class="filters-card">
    <div class="filter-group">
      <label for="filtroPreceptor"><i class="fa-solid fa-filter"></i> Filtrar por Preceptor:</label>
      <select id="filtroPreceptor">
        <option value="">Todos los preceptores</option>
        <!-- Se cargará dinámicamente o por opciones estándar -->
      </select>
    </div>
    <div class="filter-group">
      <label for="filtroEstado"><i class="fa-solid fa-check-circle"></i> Estado del Trámite:</label>
      <select id="filtroEstado">
        <option value="">Todos los estados</option>
        <option value="Pendiente">Pendiente</option>
        <option value="En Proceso">En Proceso</option>
        <option value="Listo para retirar">Listo para retirar</option>
      </select>
    </div>
  </div>

  <!-- Tabla de Solicitudes -->
  <div class="card">
    <h2><i class="fa-solid fa-address-card" style="color: var(--estudiantes-primary, #4f46e5);"></i> Bandeja de Trámites</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Estudiante / DNI</th>
            <th>Carrera / Año</th>
            <th>Trámite</th>
            <th>Preceptor</th>
            <th>Estado</th>
            <th style="text-align: right;" class="no-print">Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaSolicitudes">
          <tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: 30px;">Cargando solicitudes...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Librería CDN oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Cliente compartido de Supabase -->
  <script src="../assets/supabaseClient.js"></script>
  <!-- Control centralizado de autenticación -->
  <script src="js/admin-auth.js"></script>
  <!-- Lógica específica del módulo de estudiantes -->
  <script src="js/estudiantes-management.js"></script>
</body>
</html>
