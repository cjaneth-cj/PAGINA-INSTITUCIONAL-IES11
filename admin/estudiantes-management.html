<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Estudiantes - IES N° 11</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-styles.css">
</head>
<body>

  <main class="admin-main-content">
    <div class="top-bar">
      <div class="page-title">
        <h1>Solicitudes y Trámites Estudiantiles</h1>
        <p>Revisión, filtrado y gestión de trámites y certificados solicitados por alumnos.</p>
      </div>
      <button class="btn-cancel" onclick="window.print()" style="display: inline-flex; align-items: center; gap: 8px;">
        <i class="fa-solid fa-print"></i> Imprimir Listado
      </button>
    </div>

    <div class="admin-layout" style="grid-template-columns: 1fr 380px;">
      <!-- Bandeja de Trámites Principal (Izquierda) -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px;">
          <h2><i class="fa-solid fa-folder-open" style="color: var(--primary);"></i> Bandeja de Trámites</h2>
          
          <div style="display: flex; gap: 10px;">
            <select id="filtroPreceptor" style="padding: 6px 12px; border-radius: 8px; border: 1.5px solid var(--border); font-size: 0.85rem;">
              <option value="">Todos los Preceptores</option>
            </select>
            <select id="filtroEstado" style="padding: 6px 12px; border-radius: 8px; border: 1.5px solid var(--border); font-size: 0.85rem;">
              <option value="">Todos los Estados</option>
              <option value="Pendiente">Pendiente</option>
              <option value="En Proceso">En Proceso</option>
              <option value="Completado">Completado</option>
            </select>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Estudiante / DNI</th>
                <th>Carrera</th>
                <th>Trámite</th>
                <th>Estado</th>
                <th style="text-align: right;">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaTramites">
              <tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">Cargando trámites...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Calendario / Turnos (Derecha) -->
      <div class="card">
        <h2><i class="fa-solid fa-calendar-days" style="color: var(--primary);"></i> Mesas de Examen</h2>
        <form id="formTurnoExamen">
          <div class="form-group">
            <label for="turnoConvocatoria">Turno / Convocatoria</label>
            <input type="text" id="turnoConvocatoria" placeholder="Ej: Turno Julio - Agosto" required>
          </div>

          <div class="form-group">
            <label for="periodoExamenes">Período de Exámenes</label>
            <input type="text" id="periodoExamenes" placeholder="Ej: 07 Jul - 28 Jul" required>
          </div>

          <div class="form-group">
            <label for="cierreInscripcion">Cierre de Inscripción</label>
            <input type="text" id="cierreInscripcion" placeholder="Ej: 48 hs previas">
          </div>

          <div class="form-group">
            <label for="estadoTurno">Estado</label>
            <select id="estadoTurno">
              <option value="Programado">Programado</option>
              <option value="Abierto">Inscripción Abierta</option>
              <option value="Finalizado">Finalizado</option>
            </select>
          </div>

          <button type="submit" class="btn-save" style="width: 100%; margin-top: 10px;">Guardar Turno</button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/supabaseClient.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/estudiantes-management.js"></script>
</body>
</html>
