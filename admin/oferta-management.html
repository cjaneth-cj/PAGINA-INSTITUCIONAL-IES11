<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Carreras - IES N° 11</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Enlace al archivo CSS unificado del panel -->
  <link rel="stylesheet" href="css/admin-styles.css">
</head>
<body class="oferta-page-body">

  <div class="top-bar">
    <div class="page-title">
      <h1>Oferta Académica</h1>
      <p>Gestión de carreras y actualización de planes de estudio institucionales.</p>
    </div>
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Volver al Dashboard</a>
  </div>

  <div class="admin-layout">
    <!-- Formulario Crear/Editar -->
    <div class="card">
      <h2 id="formTitulo"><i class="fa-solid fa-plus-circle" style="color: var(--oferta-primary, #2563eb);"></i> Nueva Carrera</h2>
      <form id="formCarrera">
        <input type="hidden" id="carreraId">

        <div class="form-group">
          <label for="nombre">Nombre de la Carrera</label>
          <input type="text" id="nombre" required placeholder="Ej: Tec. Superior en Desarrollo de Software">
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción / Perfil</label>
          <textarea id="descripcion" rows="3" placeholder="Resumen del campo ocupacional y objetivos..."></textarea>
        </div>

        <div class="form-row-grid">
          <div class="form-group">
            <label for="duracion">Duración</label>
            <input type="text" id="duracion" placeholder="Ej: 3 años">
          </div>
          <div class="form-group">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" placeholder="Ej: Técnico Sup.">
          </div>
        </div>

        <div class="form-group">
          <label>Plan de Estudio (PDF)</label>
          <div class="file-dropzone">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>Arrastrá o hacé clic para subir</span>
            <small>Formato PDF (máx. 15MB)</small>
            <input type="file" id="pdfPlan" accept="application/pdf">
          </div>
          <div id="fileSelectedText" class="file-selected-name"></div>
          <small id="pdfActualInfo" class="pdf-actual-info"></small>
        </div>

        <div class="form-actions">
          <button type="submit" id="btnGuardar" class="btn-save">Guardar Carrera</button>
          <button type="button" id="btnCancelar" class="btn-cancel">Cancelar</button>
        </div>
      </form>
    </div>

    <!-- Tabla de Carreras -->
    <div class="card">
      <h2><i class="fa-solid fa-list-check" style="color: var(--oferta-primary, #2563eb);"></i> Carreras Registradas</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Carrera</th>
              <th>Duración</th>
              <th>Plan</th>
              <th style="text-align: right;">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaCarreras">
            <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Cargando carreras...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Librería CDN oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Cliente compartido de Supabase -->
  <script src="../assets/supabaseClient.js"></script>
  <!-- Control centralizado de autenticación -->
  <script src="js/admin-auth.js"></script>
  <!-- Lógica específica del módulo de oferta académica -->
  <script src="js/oferta-management.js"></script>
</body>
</html>
