<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Agenda - IES N° 11</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1e3a8a;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 30px; }
    .container { max-width: 1000px; margin: 0 auto; }
    .back-nav { margin-bottom: 20px; }
    .back-nav a { text-decoration: none; color: var(--primary); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
    
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 30px; }
    h2 { font-size: 1.3rem; margin-bottom: 20px; color: var(--primary); }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--text); }
    input, select, textarea { padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); }
    
    .actions { display: flex; gap: 10px; margin-top: 10px; }
    button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    .btn-submit { background: var(--primary); color: white; }
    .btn-submit:hover { opacity: 0.9; }
    .btn-cancel { background: #e2e8f0; color: var(--text); }
    
    /* Tabla */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { background: #f1f5f9; color: var(--text-muted); font-weight: 600; }
    .tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; background: #e0e7ff; color: #3730a3; }
    .btn-edit { background: #fef3c7; color: #b45309; padding: 6px 10px; border-radius: 4px; }
    .btn-del { background: #fee2e2; color: #b91c1c; padding: 6px 10px; border-radius: 4px; margin-left: 5px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="back-nav">
      <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Volver al Panel Principal</a>
    </div>

    <!-- Formulario -->
    <div class="card">
      <h2 id="formTitle"><i class="fa-solid fa-calendar-plus"></i> Agregar Nuevo Evento a la Agenda</h2>
      <form id="formAgenda">
        <input type="hidden" id="eventoId">

        <div class="form-grid">
          <div class="form-group full">
            <label for="titulo">Título del Evento / Trámite:</label>
            <input type="text" id="titulo" required placeholder="Ej: Mesa de Exámenes de Turno Noviembre/Diciembre">
          </div>

          <div class="form-group">
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" required>
          </div>

          <div class="form-group">
            <label for="hora">Hora (opcional):</label>
            <input type="time" id="hora">
          </div>

          <div class="form-group">
            <label for="categoria">Categoría:</label>
            <select id="categoria">
              <option value="Exámenes">Exámenes</option>
              <option value="Inscripciones">Inscripciones</option>
              <option value="Acto Institucional">Acto Institucional</option>
              <option value="Receso">Receso / Feriado</option>
              <option value="General" selected>General</option>
            </select>
          </div>

          <div class="form-group">
            <label for="lugar">Lugar / Modalidad:</label>
            <input type="text" id="lugar" placeholder="Ej: Sede Central / Virtual">
          </div>

          <div class="form-group full">
            <label for="descripcion">Detalles o Indicaciones:</label>
            <textarea id="descripcion" rows="3" placeholder="Información adicional relevante para docentes y alumnos..."></textarea>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn-submit" id="btnGuardar">Guardar Evento</button>
          <button type="button" class="btn-cancel" id="btnCancelar" style="display: none;">Cancelar</button>
        </div>
      </form>
    </div>

    <!-- Lista de eventos -->
    <div class="card">
      <h2><i class="fa-solid fa-list-check"></i> Eventos Programados</h2>
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Evento</th>
            <th>Categoría</th>
            <th>Lugar</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaAgenda">
          <tr><td colspan="5" style="text-align: center;">Cargando eventos...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/supabaseClient.js"></script>
  <script>
    // Verificar sesión activa
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (!session) window.location.href = 'login.html';
    });

    const form = document.getElementById('formAgenda');
    const eventoIdInput = document.getElementById('eventoId');
    const tituloInput = document.getElementById('titulo');
    const fechaInput = document.getElementById('fecha');
    const horaInput = document.getElementById('hora');
    const categoriaInput = document.getElementById('categoria');
    const lugarInput = document.getElementById('lugar');
    const descripcionInput = document.getElementById('descripcion');
    const tablaAgenda = document.getElementById('tablaAgenda');
    const formTitle = document.getElementById('formTitle');
    const btnCancelar = document.getElementById('btnCancelar');

    // Cargar Eventos
    async function cargarEventos() {
      const { data: eventos, error } = await supabaseClient
        .from('agenda')
        .select('*')
        .order('fecha', { ascending: true });

      if (error) {
        tablaAgenda.innerHTML = '<tr><td colspan="5">Error al cargar datos.</td></tr>';
        return;
      }

      if (!eventos || eventos.length === 0) {
        tablaAgenda.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No hay eventos en la agenda actualmente.</td></tr>';
        return;
      }

      tablaAgenda.innerHTML = '';
      eventos.forEach(ev => {
        const fila = document.createElement('tr');
        fila.innerHTML = `
          <td><strong>${ev.fecha}</strong> ${ev.hora ? '<br><small>' + ev.hora.slice(0,5) + ' hs</small>' : ''}</td>
          <td>
            <strong>${ev.titulo}</strong>
            ${ev.descripcion ? '<br><small style="color: var(--text-muted);">' + ev.descripcion + '</small>' : ''}
          </td>
          <td><span class="tag">${ev.categoria}</span></td>
          <td>${ev.lugar || '-'}</td>
          <td>
            <button class="btn-edit" onclick="editarEvento(${ev.id})"><i class="fa-solid fa-pen"></i></button>
            <button class="btn-del" onclick="eliminarEvento(${ev.id})"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tablaAgenda.appendChild(fila);
      });
    }

    // Guardar / Actualizar
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = eventoIdInput.value;
      const datos = {
        titulo: tituloInput.value.trim(),
        fecha: fechaInput.value,
        hora: horaInput.value || null,
        categoria: categoriaInput.value,
        lugar: lugarInput.value.trim() || null,
        descripcion: descripcionInput.value.trim() || null
      };

      if (id) {
        const { error } = await supabaseClient.from('agenda').update(datos).eq('id', id);
        if (error) alert('Error: ' + error.message);
        else {
          alert('Evento actualizado correctamente.');
          limpiar();
          cargarEventos();
        }
      } else {
        const { error } = await supabaseClient.from('agenda').insert([datos]);
        if (error) alert('Error: ' + error.message);
        else {
          alert('Evento añadido a la agenda.');
          limpiar();
          cargarEventos();
        }
      }
    });

    // Editar
    window.editarEvento = async (id) => {
      const { data: ev, error } = await supabaseClient.from('agenda').select('*').eq('id', id).single();
      if (error) return;

      eventoIdInput.value = ev.id;
      tituloInput.value = ev.titulo;
      fechaInput.value = ev.fecha;
      horaInput.value = ev.hora || '';
      categoriaInput.value = ev.categoria;
      lugarInput.value = ev.lugar || '';
      descripcionInput.value = ev.descripcion || '';

      formTitle.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Editar Evento de la Agenda';
      btnCancelar.style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // Eliminar
    window.eliminarEvento = async (id) => {
      if (!confirm('¿Eliminar este evento de la agenda?')) return;
      const { error } = await supabaseClient.from('agenda').delete().eq('id', id);
      if (error) alert(error.message);
      else cargarEventos();
    };

    btnCancelar.addEventListener('click', limpiar);

    function limpiar() {
      form.reset();
      eventoIdInput.value = '';
      formTitle.innerHTML = '<i class="fa-solid fa-calendar-plus"></i> Agregar Nuevo Evento a la Agenda';
      btnCancelar.style.display = 'none';
    }

    cargarEventos();
  </script>
</body>
</html>
