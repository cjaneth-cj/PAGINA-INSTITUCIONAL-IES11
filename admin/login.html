<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Admin - IES N° 11</title>
  <style>
    body { font-family: sans-serif; background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 360px; }
    h2 { text-align: center; color: #1e3a8a; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #2563eb; color: white; border: none; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    .error { color: #dc2626; font-size: 13px; margin-top: 10px; text-align: center; display: none; }
    .back { display: block; text-align: center; margin-top: 15px; font-size: 13px; color: #64748b; text-decoration: none; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Panel Administrativo</h2>
    <form id="formLogin">
      <div class="form-group">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" required placeholder="admin@ies11.edu.ar">
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" id="btnIngresar">Iniciar Sesión</button>
      <div id="mensajeError" class="error"></div>
    </form>
    <a href="../index.html" class="back">← Volver al sitio web</a>
  </div>

  <!-- 1. Librería CDN oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. Lógica directa con tus credenciales integradas -->
  <script>
    // Inicialización directa
    const SUPABASE_URL = 'https://smoizmmrkhdgrirfcynu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_-lAeJuIOfnpOeA8ixU2fEQ_Jqy0lLU1';
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('formLogin');
    const mensajeError = document.getElementById('mensajeError');
    const btnIngresar = document.getElementById('btnIngresar');

    // Verificar si ya hay una sesión activa
    dbClient.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        window.location.href = 'index.html';
      }
    });

    // Manejo del formulario de login
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mensajeError.style.display = 'none';
      btnIngresar.innerText = 'Verificando...';
      btnIngresar.disabled = true;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await dbClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          console.error('Error de autenticación:', error);
          mensajeError.innerText = 'Error: ' + error.message;
          mensajeError.style.display = 'block';
        } else {
          console.log('Login exitoso:', data);
          window.location.href = 'index.html';
        }
      } catch (err) {
        console.error('Error general:', err);
        mensajeError.innerText = 'Ocurrió un problema de conexión.';
        mensajeError.style.display = 'block';
      } finally {
        btnIngresar.innerText = 'Iniciar Sesión';
        btnIngresar.disabled = false;
      }
    });
  </script>
</body>
</html>
