<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Admin - IES N° 11</title>
  <!-- Enlace al archivo CSS externo del panel de administración -->
  <link rel="stylesheet" href="css/admin-styles.css">
</head>
<body class="login-body">

  <div class="login-card">
    <h2>Panel Administrativo</h2>
    <form id="formLogin">
      <div class="form-group">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" required placeholder="admin@ies11.edu.ar">
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" id="btnIngresar">Iniciar Sesión</button>
      <div id="mensajeError" class="error"></div>
    </form>
    <a href="../index.html" class="back">← Volver al sitio web</a>
  </div>

  <!-- Librería oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Script externo modular para la autenticación -->
  <script src="js/login.js"></script>
</body>
</html>
